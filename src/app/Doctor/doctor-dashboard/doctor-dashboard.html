<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-4 py-3">

  <a class="navbar-brand fw-bold fs-4">
    Healthcare Appointment & Patient Management System
  </a>

  <div class="ms-auto">

    <button class="btn btn-light fw-semibold px-4"
            (click)="logout()">

      <i class="bi bi-box-arrow-right me-2"></i>
      Logout

    </button>

  </div>

</nav>

<div class="d-flex">

  <!-- Sidebar -->
  <div class="bg-dark text-white p-4 vh-100 shadow"
       style="width: 350px;">

    <h4 class="text-center fw-bold border-bottom pb-3 mb-4">
      Doctor Dashboard
    </h4>

    <ul class="nav flex-column gap-3">

      <!-- Add Details -->
      <li class="nav-item">

        <a routerLink="/add-doctor"
           class="nav-link text-white rounded px-3 py-2 sidebar-link">

          <i class="bi bi-person-plus-fill me-2"></i>
          Add Details

        </a>

      </li>

      <!-- View Profile -->
      <li class="nav-item">

        <a routerLink="/view-doctor-profile"
           class="nav-link text-white rounded px-3 py-2 sidebar-link">

          <i class="bi bi-person-vcard-fill me-2"></i>
          View Profile

        </a>

      </li>

      <!-- View Appointments -->
      <li class="nav-item">

        <a routerLink="/view-doctor-appointments"
           class="nav-link text-white rounded px-3 py-2 sidebar-link">

          <i class="bi bi-calendar-check-fill me-2"></i>
          View Appointments

        </a>

      </li>

    </ul>

  </div>

  <!-- Main Content -->
  <div class="container-fluid bg-light min-vh-100 p-5">

    <!-- Welcome Card -->
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

      <div class="card-body p-5 text-center">

        <!-- Doctor Icon -->
        <div class="mb-4">

          <i class="bi bi-person-circle text-primary"
             style="font-size: 5rem;"></i>

        </div>

        <!-- Welcome -->
        <h2 class="fw-bold text-success mb-3">
          Welcome, Dr. {{username}}
        </h2>

        <p class="text-muted fs-5">
          Manage your appointments, profile, and healthcare details efficiently.
        </p>

        <hr class="my-4">

        <!-- Quick Actions -->
        <div class="row g-4 justify-content-center">

          <!-- Add Details -->
          <div class="col-md-4">

            <div class="card border-0 shadow-sm rounded-4 h-100">

              <div class="card-body text-center p-4">

                <i class="bi bi-person-plus-fill text-primary fs-1"></i>

                <h5 class="mt-3 fw-bold">
                  Add Details
                </h5>

                <a routerLink="/add-doctor"
                   class="btn btn-primary rounded-pill px-4 mt-3">

                  Open

                </a>

              </div>

            </div>

          </div>

          <!-- View Profile -->
          <div class="col-md-4">

            <div class="card border-0 shadow-sm rounded-4 h-100">

              <div class="card-body text-center p-4">

                <i class="bi bi-person-vcard-fill text-success fs-1"></i>

                <h5 class="mt-3 fw-bold">
                  View Profile
                </h5>

                <a routerLink="/view-doctor-profile"
                   class="btn btn-success rounded-pill px-4 mt-3">

                  Open

                </a>

              </div>

            </div>

          </div>

          <!-- View Appointments -->
          <div class="col-md-4">

            <div class="card border-0 shadow-sm rounded-4 h-100">

              <div class="card-body text-center p-4">

                <i class="bi bi-calendar-check-fill text-warning fs-1"></i>

                <h5 class="mt-3 fw-bold">
                  Appointments
                </h5>

                <a routerLink="/view-doctor-appointments"
                   class="btn btn-warning text-white rounded-pill px-4 mt-3">

                  Open

                </a>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
