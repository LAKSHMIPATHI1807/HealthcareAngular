<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-4 py-3">

  <a class="navbar-brand fw-bold fs-4">
    Healthcare Appointment & Patient Management System
  </a>

</nav>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <!-- Profile Card -->
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-primary text-white text-center p-4">

          <div class="mb-3">

            <i class="bi bi-person-badge-fill"
               style="font-size: 5rem;"></i>

          </div>

          <h2 class="fw-bold mb-1">
            Doctor Profile
          </h2>

          <p class="mb-0">
            View and manage your professional details
          </p>

        </div>

        <!-- Body -->
        <div class="card-body p-5">

          <!-- Success Message -->
          <div *ngIf="message"
               class="alert alert-success rounded-3 text-center">

            {{message}}

          </div>

          <form>

            <!-- Doctor ID -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Doctor ID
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3 bg-light"
                     [(ngModel)]="doctor.doctorId"
                     name="doctorId"
                     readonly>

            </div>

            <!-- Name -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Doctor Name
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3 bg-light"
                     [(ngModel)]="doctor.name"
                     name="name"
                     readonly>

            </div>

            <!-- Specialization -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Specialization
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3 bg-light"
                     [(ngModel)]="doctor.speicalization"
                     name="speicalization"
                     readonly>

            </div>

            <!-- Available Time Slot -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Available Time Slot
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3"
                     [(ngModel)]="doctor.availableTimeSlot"
                     name="availableTimeSlot"
                     [readonly]="!isEditMode">

            </div>

            <!-- Buttons -->
            <div class="d-flex flex-wrap gap-3 justify-content-center mt-4">

              <!-- Update -->
              <button *ngIf="!isEditMode"
                      type="button"
                      class="btn btn-primary px-4 py-2 rounded-pill fw-semibold"
                      (click)="enableEdit()">

                <i class="bi bi-pencil-square me-2"></i>
                Update Profile

              </button>

              <!-- Save -->
              <button *ngIf="isEditMode"
                      type="button"
                      class="btn btn-success px-4 py-2 rounded-pill fw-semibold"
                      (click)="updatedoctor()">

                <i class="bi bi-check-circle-fill me-2"></i>
                Save Changes

              </button>

              <!-- Delete -->
              <button type="button"
                      class="btn btn-danger px-4 py-2 rounded-pill fw-semibold"
                      (click)="deleteDoctor()">

                <i class="bi bi-trash-fill me-2"></i>
                Delete Profile

              </button>

            </div>

            <!-- Back -->
            <div class="text-center mt-4">

              <a routerLink="/doctor-dashboard"
                 class="text-decoration-none fw-semibold text-primary">

                <i class="bi bi-arrow-left-circle me-1"></i>
                Back to Dashboard

              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
