    <a routerLink="/"

<!-- Login Section -->
<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-7 col-lg-5">

      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-success text-white text-center p-4">

          <h2 class="fw-bold mb-1">
            Welcome Back
          </h2>

          <p class="mb-0">
            Login to continue to HMS Portal
          </p>

        </div>

        <!-- Body -->
        <div class="card-body p-5">

          <!-- Success Message -->
          <div *ngIf="message"
               class="alert alert-success text-center rounded-3">

            {{message}}

          </div>

          <!-- Login Form -->
          <form #loginform="ngForm"
                (ngSubmit)="login(loginform)">

            <!-- Username -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Username
              </label>

              <input type="text"
                     name="userName"
                     class="form-control form-control-lg rounded-3"
                     placeholder="Enter Username"
                     [(ngModel)]="user.username"
                     required
                     #userName="ngModel">

              <div class="text-danger small mt-2"
                   *ngIf="userName.invalid && userName.touched">

                Username is required

              </div>

            </div>

            <!-- Password -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Password
              </label>

              <input type="password"
                     name="password"
                     class="form-control form-control-lg rounded-3"
                     placeholder="Enter Password"
                     [(ngModel)]="user.password"
                     required
                     #password="ngModel">

              <div class="text-danger small mt-2"
                   *ngIf="password.invalid && password.touched">

                Password is required

              </div>

            </div>

            <!-- Button -->
            <div class="d-grid mb-3">

              <button type="submit"
                      class="btn btn-success btn-lg rounded-3 fw-semibold"
                      [disabled]="loginform.invalid">

                Login

              </button>

            </div>

          </form>

        </div>

        <!-- Footer -->
        <div class="card-footer bg-white text-center py-3 border-0">

          <span class="text-muted">
            Don't have an account?
          </span>

          <a routerLink="/register"
             class="text-success fw-semibold text-decoration-none ms-1">

            Register Here

          </a>

        </div>

      </div>

    </div>

  </div>

</div>
