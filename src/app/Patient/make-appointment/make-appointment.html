<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-4 py-3">

  <a class="navbar-brand fw-bold fs-4">
    Healthcare Appointment & Patient Management System
  </a>

</nav>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-lg-7 col-md-9">

      <!-- Appointment Card -->
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-primary text-white text-center p-4">

          <div class="mb-3">

            <i class="bi bi-calendar-check-fill"
               style="font-size: 4rem;"></i>

          </div>

          <h2 class="fw-bold mb-1">
            Make Appointment
          </h2>

          <p class="mb-0">
            Schedule your appointment with a doctor
          </p>

        </div>

        <!-- Body -->
        <div class="card-body p-5">

          <!-- Success Message -->
          <div *ngIf="message"
               class="alert alert-success rounded-3 text-center">

            {{message}}

          </div>

          <!-- Form -->
          <form (ngSubmit)="submit()">

            <!-- Patient Name -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Patient Name
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3 bg-light"
                     [value]="patient.name"
                     readonly>

            </div>

            <!-- Doctor Dropdown -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Select Doctor
              </label>

              <select class="form-select form-select-lg rounded-3"
                      [(ngModel)]="appointmentObj.doctorId"
                      name="doctorId"
                      required>

                <option value="0">
                  Select Doctor
                </option>

                <option *ngFor="let doc of doctors"
                        [value]="doc.doctorId">

                  Dr. {{doc.name}} - {{doc.specialization}}

                </option>

              </select>

            </div>

            <!-- Appointment Info
            <div class="alert alert-info rounded-3">

              <i class="bi bi-info-circle-fill me-2"></i>

              Your appointment will be scheduled after confirmation.

            </div> -->

            <!-- Submit Button -->
            <div class="d-grid mt-4">

              <button class="btn btn-primary btn-lg rounded-3 fw-semibold">

                <i class="bi bi-calendar-plus-fill me-2"></i>
                Book Appointment

              </button>

            </div>

            <!-- Back -->
            <div class="text-center mt-4">

              <a routerLink="/patient-dashboard"
                 class="text-decoration-none fw-semibold text-primary">

                <i class="bi bi-arrow-left-circle me-1"></i>
                Back to Dashboard

              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
