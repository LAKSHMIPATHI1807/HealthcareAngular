<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-4 py-3">

  <a class="navbar-brand fw-bold fs-4">
    Healthcare Appointment & Patient Management System
  </a>

</nav>

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-8 col-lg-6">

      <!-- Card -->
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

        <!-- Header -->
        <div class="bg-primary text-white text-center p-4">

          <h2 class="fw-bold mb-1">
            Add Patient Details
          </h2>

          <p class="mb-0">
            Enter patient information carefully
          </p>

        </div>

        <!-- Body -->
        <div class="card-body p-5">

          <!-- Success Message -->
          <div *ngIf="message"
               class="alert alert-success text-center rounded-3">

            {{message}}

          </div>

          <!-- Form -->
          <form #addForm="ngForm"
                (ngSubmit)="add(addForm)">

            <!-- Name -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Full Name
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3"
                     name="name"
                     [(ngModel)]="patient.name"
                     placeholder="Enter Full Name"
                     required
                     #name="ngModel">

              <div class="text-danger small mt-2"
                   *ngIf="name.invalid && name.touched">

                Name is required

              </div>

            </div>

            <!-- Age -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Age
              </label>

              <input type="number"
                     class="form-control form-control-lg rounded-3"
                     name="age"
                     [(ngModel)]="patient.age"
                     placeholder="Enter Age"
                     required
                     #age="ngModel">

              <div class="text-danger small mt-2"
                   *ngIf="age.invalid && age.touched">

                Age is required

              </div>

            </div>

            <!-- Gender -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Gender
              </label>

              <select class="form-select form-select-lg rounded-3"
                      name="gender"
                      [(ngModel)]="patient.gender"
                      required
                      #gender="ngModel">

                <option value="">
                  Select Gender
                </option>

                <option value="Male">
                  Male
                </option>

                <option value="Female">
                  Female
                </option>

              </select>

              <div class="text-danger small mt-2"
                   *ngIf="gender.invalid && gender.touched">

                Please select gender

              </div>

            </div>

            <!-- Contact -->
            <div class="mb-4">

              <label class="form-label fw-semibold">
                Contact Number
              </label>

              <input type="text"
                     class="form-control form-control-lg rounded-3"
                     name="contactNumber"
                     [(ngModel)]="patient.contactNumber"
                     placeholder="Enter Phone Number"
                     required
                     #contactNumber="ngModel">

              <div class="text-danger small mt-2"
                   *ngIf="contactNumber.invalid && contactNumber.touched">

                Contact number is required

              </div>

            </div>

            <!-- Submit -->
            <div class="d-grid mb-3">

              <button class="btn btn-success btn-lg rounded-3 fw-semibold"
                      [disabled]="addForm.invalid">

                <i class="bi bi-person-plus-fill me-2"></i>
                Add Patient

              </button>

            </div>

            <!-- Back -->
            <div class="text-center">

              <a routerLink="/patient-dashboard"
                 class="text-decoration-none fw-semibold text-primary">

                <i class="bi bi-arrow-left-circle me-1"></i>
                Back to Dashboard

              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
